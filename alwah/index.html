<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ألواح</title>
    <meta name="description" content="متابعة حفظ القرآن للأسرة: الحفظ الجديد والألواح والمراجعة" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1f5f4a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ألواح" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri+Quran&family=Amiri:wght@700&display=swap" rel="stylesheet" />
    <script>
      // ألواح مستقلة عن سماك: متى ما عمل نطاقها الخاص alwah.semak.sa انتقل إليه تلقائياً،
      // فلا يحسبها أندرويد من تطبيقات سماك المثبّتة على semak.sa
      (function () {
        if (location.hostname !== 'semak.sa' && location.hostname !== 'www.semak.sa') return;
        var to = 'https://alwah.semak.sa/';
        fetch(to + 'manifest.webmanifest', { mode: 'no-cors', cache: 'no-store' })
          .then(function () { location.replace(to + location.hash); })
          .catch(function () {});
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
