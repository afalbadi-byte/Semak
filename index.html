    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // تطبيق المشتريات يحتاج بطاقة تعريفه قبل أن يقيّم المتصفح قابلية التثبيت،
      // وإلا لم يظهر زر التثبيت بنقرة واحدة أو ثبّت الموقع بدل التطبيق.
      (function () {
        if (location.pathname.indexOf("/buy") !== 0) return;
        var m = document.querySelector("link[rel=manifest]");
        if (m) m.setAttribute("href", "/buy.webmanifest");
        var a = document.querySelector("link[rel=apple-touch-icon]");
        if (a) a.setAttribute("href", "/images/app-icon-512.png");
      })();
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
      <script>
      // الحدث يصل قبل إقلاع الواجهة، فنلتقطه هنا وإلا ضاع زر التثبيت
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__bip = e;
        window.dispatchEvent(new Event("bip-ready"));
      });
      window.addEventListener("appinstalled", function () { window.__bip = null; });

      // التسجيل من index.html لأنه وحده غير مخزَّن، فيصل التحديث دائما
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/service-worker.js")
            .then(function (r) { r.update(); })
            .catch(function () {});
        });
      }
    </script>
  </body>
