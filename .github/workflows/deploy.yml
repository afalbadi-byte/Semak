name: Build & Deploy to semak.sa

on:
  push:
    branches: [main]

concurrency:
  group: deploy-semak
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint api.php (syntax gate)
        run: php -l api.php

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_MOTTASL_API_KEY: ${{ secrets.VITE_MOTTASL_API_KEY }}
          VITE_WA_ADMIN_PHONE: ${{ secrets.VITE_WA_ADMIN_PHONE }}
          VITE_WA_CLIENT_TEMPLATE_ID: ${{ secrets.VITE_WA_CLIENT_TEMPLATE_ID }}
          VITE_WA_CLIENT_TEMPLATE_LANG: ${{ secrets.VITE_WA_CLIENT_TEMPLATE_LANG }}
          VITE_WA_MAINT_TEMPLATE_ID: ${{ secrets.VITE_WA_MAINT_TEMPLATE_ID }}

      - name: Copy api.php to dist
        run: cp api.php dist/api.php

      - name: Inject Anthropic API key
        run: sed -i "s|__ANTHROPIC_KEY__|${{ secrets.ANTHROPIC_API_KEY }}|g" dist/api.php

      - name: Inject Daftra API key
        run: sed -i "s|__DAFTRA_KEY__|${{ secrets.DAFTRA_API_KEY }}|g" dist/api.php

      - name: Inject Daftra credentials
        run: |
          sed -i "s|__DAFTRA_EMAIL__|${{ secrets.DAFTRA_EMAIL }}|g" dist/api.php
          sed -i "s|__DAFTRA_PASSWORD__|${{ secrets.DAFTRA_PASSWORD }}|g" dist/api.php
          sed -i "s|__DAFTRA_CLIENT_ID__|${{ secrets.DAFTRA_CLIENT_ID }}|g" dist/api.php
          sed -i "s|__DAFTRA_CLIENT_SECRET__|${{ secrets.DAFTRA_CLIENT_SECRET }}|g" dist/api.php

      - name: Inject Daftra session cookie
        run: sed -i "s|__DAFTRA_SESSION__|${{ secrets.DAFTRA_SESSION_COOKIE }}|g" dist/api.php

      - name: Inject SMTP credentials
        run: |
          sed -i "s|__SMTP_HOST__|${{ secrets.SMTP_HOST }}|g" dist/api.php
          sed -i "s|__SMTP_PORT__|${{ secrets.SMTP_PORT }}|g" dist/api.php
          sed -i "s|__SMTP_USER__|${{ secrets.SMTP_USER }}|g" dist/api.php
          sed -i "s|__SMTP_PASS__|${{ secrets.SMTP_PASS }}|g" dist/api.php
          sed -i "s|__SMTP_FROM__|${{ secrets.SMTP_FROM }}|g" dist/api.php
          sed -i "s|__SMTP_FROM_NAME__|${{ secrets.SMTP_FROM_NAME }}|g" dist/api.php
          sed -i "s|__SMTP_SECURE__|${{ secrets.SMTP_SECURE }}|g" dist/api.php

      - name: Inject SaaS JWT & platform admin secrets
        run: |
          sed -i "s|__TOKEN_SECRET__|${{ secrets.TOKEN_SECRET }}|g"       dist/api.php
          sed -i "s|__PLATFORM_SECRET__|${{ secrets.PLATFORM_SECRET }}|g" dist/api.php
          sed -i "s|__PLATFORM_EMAIL__|${{ secrets.PLATFORM_EMAIL }}|g"   dist/api.php
          sed -i "s|__PLATFORM_HASH__|${{ secrets.PLATFORM_HASH }}|g"     dist/api.php

      - name: Inject DB credentials & Mottasl token
        run: |
          sed -i "s|__DB_USER__|${{ secrets.DB_USER }}|g"             dist/api.php
          sed -i "s|__DB_PASS__|${{ secrets.DB_PASS }}|g"             dist/api.php
          sed -i "s|__DB_NAME__|${{ secrets.DB_NAME }}|g"             dist/api.php
          sed -i "s|__MOTTASL_TOKEN__|${{ secrets.VITE_MOTTASL_API_KEY }}|g" dist/api.php

      - name: Save built files as artifact (manual upload fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-semak-${{ github.run_number }}
          path: dist/
          retention-days: 7

      - name: Decode SSH key
        run: |
          echo "${{ secrets.SSH_KEY }}" | base64 -d > "$RUNNER_TEMP/dk"
          chmod 600 "$RUNNER_TEMP/dk"

      - name: Deploy via scp-action
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key_path: /github/runner_temp/dk
          source: "dist/*"
          target: ${{ secrets.SSH_TARGET }}
          strip_components: 1
          rm: false
          timeout: 60s
          command_timeout: 10m

      - name: Clean up key
        if: always()
        run: rm -f "$RUNNER_TEMP/dk"
