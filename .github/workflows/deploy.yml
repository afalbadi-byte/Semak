name: Build & Deploy to semak.sa

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_MOTTASL_API_KEY: ${{ secrets.VITE_MOTTASL_API_KEY }}
          VITE_WA_ADMIN_PHONE: ${{ secrets.VITE_WA_ADMIN_PHONE }}
          VITE_WA_CLIENT_TEMPLATE_ID: ${{ secrets.VITE_WA_CLIENT_TEMPLATE_ID }}
          VITE_WA_CLIENT_TEMPLATE_LANG: ${{ secrets.VITE_WA_CLIENT_TEMPLATE_LANG }}
          VITE_WA_MAINT_TEMPLATE_ID: ${{ secrets.VITE_WA_MAINT_TEMPLATE_ID }}

      - name: Copy api.php to dist
        run: cp api.php dist/api.php

      - name: Inject Anthropic API key
        run: sed -i "s|__ANTHROPIC_KEY__|${{ secrets.ANTHROPIC_API_KEY }}|g" dist/api.php

      - name: Inject Daftra API key
        run: sed -i "s|__DAFTRA_KEY__|${{ secrets.DAFTRA_API_KEY }}|g" dist/api.php

      - name: Inject Daftra credentials
        run: |
          sed -i "s|__DAFTRA_EMAIL__|${{ secrets.DAFTRA_EMAIL }}|g" dist/api.php
          sed -i "s|__DAFTRA_PASSWORD__|${{ secrets.DAFTRA_PASSWORD }}|g" dist/api.php
          sed -i "s|__DAFTRA_CLIENT_ID__|${{ secrets.DAFTRA_CLIENT_ID }}|g" dist/api.php
          sed -i "s|__DAFTRA_CLIENT_SECRET__|${{ secrets.DAFTRA_CLIENT_SECRET }}|g" dist/api.php

      - name: Inject Daftra session cookie
        run: sed -i "s|__DAFTRA_SESSION__|${{ secrets.DAFTRA_SESSION_COOKIE }}|g" dist/api.php

      # Hostinger FTP suffers outage windows that can exceed 30 min. We space
      # attempts out with escalating backoff sleeps to ride out a long outage —
      # 8 attempts spanning ~35 min. Each gate checks only the IMMEDIATELY
      # preceding attempt: if a prior attempt succeeded, its successor's step is
      # skipped (outcome 'skipped' != 'failure'), so the chain stops cleanly.
      # Attempts 1-7 use continue-on-error; the final attempt gates job success.
      - name: Deploy to server via FTP (attempt 1)
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          local-dir: ./dist/
          server-dir: ./
          timeout: 600000
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Backoff before attempt 2
        if: steps.ftp1.outcome == 'failure'
        run: sleep 180

      - name: Deploy to server via FTP (attempt 2)
        id: ftp2
        if: steps.ftp1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          local-dir: ./dist/
          server-dir: ./
          timeout: 600000
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Backoff before attempt 3
        if: steps.ftp2.outcome == 'failure'
        run: sleep 300

      - name: Deploy to server via FTP (attempt 3)
        id: ftp3
        if: steps.ftp2.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          local-dir: ./dist/
          server-dir: ./
          timeout: 600000
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Backoff before attempt 4
        if: steps.ftp3.outcome == 'failure'
        run: sleep 300

      - name: Deploy to server via FTP (attempt 4)
        id: ftp4
        if: steps.ftp3.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          local-dir: ./dist/
          server-dir: ./
          timeout: 600000
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Backoff before attempt 5
        if: steps.ftp4.outcome == 'failure'
        run: sleep 300

      - name: Deploy to server via FTP (attempt 5)
        id: ftp5
        if: steps.ftp4.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          local-dir: ./dist/
          server-dir: ./
          timeout: 600000
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Backoff before attempt 6
        if: steps.ftp5.outcome == 'failure'
        run: sleep 300

      - name: Deploy to server via FTP (attempt 6)
        id: ftp6
        if: steps.ftp5.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          local-dir: ./dist/
          server-dir: ./
          timeout: 600000
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Backoff before attempt 7
        if: steps.ftp6.outcome == 'failure'
        run: sleep 300

      - name: Deploy to server via FTP (attempt 7)
        id: ftp7
        if: steps.ftp6.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          local-dir: ./dist/
          server-dir: ./
          timeout: 600000
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Backoff before attempt 8
        if: steps.ftp7.outcome == 'failure'
        run: sleep 300

      - name: Deploy to server via FTP (attempt 8, final)
        if: steps.ftp7.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          local-dir: ./dist/
          server-dir: ./
          timeout: 600000
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**